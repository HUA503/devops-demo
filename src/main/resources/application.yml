server:
  port: 8080

spring:
  application:
    name: devops-demo

logging:
  level:
    root: INFO
    com.demo: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    rocketmq:
  name-server: 192.168.1.100:9876
  producer:
    group: devops-producer-group
